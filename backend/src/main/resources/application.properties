# ========================
# 共用設定（所有環境通用）
# ========================

spring.application.name=restaurant-system

# 啟動時用哪個環境 profile（dev / prod）
# 實際開發時用 dev，上線用 prod
spring.profiles.active=dev

# JPA 設定
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# 檔案上傳限制
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# JSON 格式設定
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=Asia/Taipei
spring.jackson.serialization.write-dates-as-timestamps=false

# Swagger/OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# LINE Pay sandbox defaults
# Override these in application-dev.properties or environment variables for real payment testing.
linepay.channel-id=${LINEPAY_CHANNEL_ID:demo-channel-id}
linepay.channel-secret=${LINEPAY_CHANNEL_SECRET:demo-channel-secret}
linepay.api-base-url=${LINEPAY_API_BASE_URL:https://sandbox-api-pay.line.me}
linepay.confirm-url=${LINEPAY_CONFIRM_URL:http://localhost:5173/payment/linepay/confirm}
linepay.cancel-url=${LINEPAY_CANCEL_URL:http://localhost:5173/order}

# 前台網址：訂位成功信、訂金付款完成後會使用這個網址導回前台頁面
# 本機預設 localhost；部署到其他 server 用環境變數 APP_FRONTEND_BASE_URL 覆蓋
app.frontend-base-url=${APP_FRONTEND_BASE_URL:http://localhost:5173}

# 後端網址：綠界付款 ReturnURL / OrderResultURL 會使用這個網址回到後端 API
# 本機預設 localhost；部署到其他 server 用環境變數 APP_BACKEND_BASE_URL 覆蓋
app.backend-base-url=${APP_BACKEND_BASE_URL:http://localhost:8080}
